  <div style="display:flex;gap:12px;margin-bottom:12px">
    <label><input type="radio" name="mkind" value="builder" ${curKind!='code'?'checked':''}> 🎨 <b>No-Code Game Builder</b></label>
    <label><input type="radio" name="mkind" value="code" ${curKind=='code'?'checked':''}> 💻 <b>Custom Code Studio (JS/Canvas)</b></label>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <label>Title *<input class="in" id="t" maxlength="40" placeholder="e.g. Shadow Crypt" value="${esc(e.t||'')}"></label>
    <label>Emoji Icon<input class="in" id="em" maxlength="4" placeholder="e.g. 🗡️" value="${esc(e.e||'🎮')}"></label>
  </div>
  <label>Description *<textarea class="in" id="d" rows="2" maxlength="300" placeholder="Describe the goal and lore of your game...">${esc(e.d||'')}</textarea></label>
  <label>Controls Hint<input class="in" id="ct" maxlength="120" placeholder="e.g. WASD / Arrows to move · Space for action" value="${esc(e.ctl||'WASD / Arrows to move · Space for action')}"></label>

  <div id="builder-fields" style="${curKind=='code'?'display:none':''}">
    <div style="background:#0b132b;border:1px solid #1b2a55;border-radius:12px;padding:12px;margin-bottom:12px">
      <h3 style="margin-top:0">Game Archetype & Logic</h3>
      <label>Preset Archetype:
        <select id="b_arch" class="in" style="width:auto;display:inline-block;margin-left:8px">
          <option value="dungeon" ${e.arch=='dungeon'?'selected':''}>🗡️ Dungeon / Crypt Adventure (Collect & Escape)</option>
          <option value="blaster" ${e.arch=='blaster'?'selected':''}>🚀 Space / Arena Blaster (Shoot & Destroy)</option>
          <option value="platformer" ${e.arch=='platformer'?'selected':''}>🥷 Platform Jumper (Run & Jump)</option>
          <option value="collector" ${e.arch=='collector'?'selected':''}>💎 Gem Collector / Survival Run</option>
        </select>
      </label>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px">
        <label>Player Avatar Emoji<input class="in" id="b_pChar" maxlength="4" value="${esc(e.pChar||'🧙‍♂️')}"></label>
        <label>Player Move Speed<input class="in" id="b_pSpd" type="number" min="80" max="320" value="${e.pSpd||170}"></label>
        <label>Collectible Item Emoji<input class="in" id="b_iChar" maxlength="4" value="${esc(e.iChar||'💎')}"></label>
        <label>Item Count<input class="in" id="b_iCount" type="number" min="3" max="25" value="${e.iCount||8}"></label>
        <label>Points Per Item<input class="in" id="b_iVal" type="number" min="10" max="500" value="${e.iVal||50}"></label>
        <label>Hazard / Enemy Emoji<input class="in" id="b_eChar" maxlength="4" value="${esc(e.eChar||'👾')}"></label>
        <label>Enemy Count<input class="in" id="b_eCount" type="number" min="1" max="15" value="${e.eCount||5}"></label>
        <label>Enemy Speed<input class="in" id="b_eSpd" type="number" min="20" max="220" value="${e.eSpd||70}"></label>
        <label>Time Limit (Seconds)<input class="in" id="b_time" type="number" min="20" max="300" value="${e.timeGoal||60}"></label>
      </div>
    </div>
  </div>

  <div id="code-fields" style="${curKind!='code'?'display:none':''}">
    <div style="background:#070a14;border:1px solid #1b2a55;border-radius:12px;padding:12px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="margin:0">JavaScript Canvas Engine Code</h3>
        <select id="code-tpl" class="in" style="width:auto;font-size:12px">
          <option value="">Load Template...</option>
          <option value="dungeon">Dungeon Template</option>
          <option value="blaster">Shooter Template</option>
          <option value="jumper">Platformer Template</option>
        </select>
      </div>
      <p style="font-size:12px;color:#8fa3d6;margin:6px 0">Params: <code>(x, a, L, K, P, snd, rr, boom, dFx, rnd, W, H)</code></p>
      <textarea class="in" id="cd_src" rows="10" style="font-family:monospace;font-size:12px;tab-size:2">${esc(e.code||`// Custom Game Template
let p={x:320,y:200},items=[],sc=0;
for(let i=0;i<6;i++)items.push({x:rnd(40,600),y:rnd(40,360)});
L(d=>{
  p.x+=ax(['ArrowRight','d'],['ArrowLeft','a'])*180*d;
  p.y+=ax(['ArrowDown','s'],['ArrowUp','w'])*180*d;
  items=items.filter(it=>{
    if(Math.hypot(p.x-it.x,p.y-it.y)<22){sc+=100;a.score(sc);snd(900);boom(it.x,it.y,'#fde047');return 0}
    return 1;
  });
  if(!items.length)return a.over('All Items Collected! Win!');
  x.fillStyle='#0f172a';x.fillRect(0,0,W,H);
  items.forEach(it=>{x.font='20px system-ui';x.fillText('⭐',it.x-10,it.y+7)});
  x.font='24px system-ui';x.fillText('🚀',p.x-12,p.y+8);
  dFx(x,d);
  x.fillStyle='#fff';x.font='700 14px system-ui';x.fillText('Score: '+sc,14,20);
});`)}</textarea>
    </div>
  </div>

  <p>Categories</p>
  <div class="chips" style="flex-wrap:wrap">${CATS.map(k=>`<label class="card" style="padding:4px 10px"><input type="checkbox" name="cat" value="${k}" ${(e.cats||['Adventure']).includes(k)?'checked':''}> ${k}</label>`).join('')}</div>

  <p>Theme Gradient: <input type="color" id="c1" value="${col[0]}"> <input type="color" id="c2" value="${col[1]||'#110026'}"> &nbsp;
    <label><input type="checkbox" id="ft" ${e.feat?'checked':''}> Featured</label> &nbsp;
    <label><input type="checkbox" id="pb" ${e.pub!==false?'checked':''}> Published</label>
  </p>

  <div style="background:#000;border:1px solid #1b2a55;border-radius:14px;overflow:hidden;margin:14px 0;max-width:640px">
    <div style="background:#070c1d;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1b2a55">
      <span style="font-size:12px;font-weight:700">Live Preview Canvas (640x400)</span>
      <div style="display:flex;gap:6px">
        <button class="b" id="btn-test" style="padding:4px 10px;font-size:12px">▶ Test Play</button>
        <button class="b" id="btn-stop" style="padding:4px 10px;font-size:12px">⏹ Stop</button>
      </div>
    </div>
    <canvas id="pvcv" width="640" height="400" style="width:100%;aspect-ratio:8/5;display:block;background:#05070f"></canvas>
  </div>

  <button class="b" data-a="save-create" style="background:var(--b);color:#fff;font-weight:700">${e.id?'Save Changes & Publish':'Create & Publish Game'}</button>
  ${e.id?'<button class="b" data-a="cancel">Cancel</button>':''}
  <p id="er" style="color:#ff6b6b;font-weight:700"></p>
</div>
`:''}

// Hook up password change
const btnSavePw = $('#btn_save_pw');
if(btnSavePw){
  btnSavePw.onclick = async () => {
    let cur = $('#cur_pw').value.trim();
    let np = $('#new_pw').value.trim();
    let cfm = $('#cfm_pw').value.trim();
    let msg = $('#pw_msg');
    msg.style.color = '#ff6b6b';
    if(!cur) return (msg.textContent = 'Enter your current password.');
    if(!np || np.length < 6) return (msg.textContent = 'New password must be at least 6 characters.');
    if(np !== cfm) return (msg.textContent = 'New passwords do not match.');
    msg.style.color = '#8fa3d6';
    msg.textContent = 'Updating password...';
    try {
      let res = await fetch('/api/admin/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword: cur, newPassword: np })
      });
      let data = await res.json();
      if(!res.ok || !data.success){
        msg.style.color = '#ff6b6b';
        return (msg.textContent = data.error || 'Failed to update password.');
      }
      let newHash = data.hash;
      if(newHash) LS('ah', newHash); LS('plain_ah', np);
      msg.style.color = '#10b981';
      msg.textContent = '✓ Password changed successfully across all devices!';
      $('#cur_pw').value = '';
      $('#new_pw').value = '';
      $('#cfm_pw').value = '';
    } catch(err) {
      msg.style.color = '#ff6b6b';
      msg.textContent = 'Server connection failed. Could not update password.';
    }
  };
}

// Hook up tab switching and test preview
document.querySelectorAll('[data-tab]').forEach(btn=>{
  btn.onclick=()=>{adminTab=btn.dataset.tab;admin()};
});

const mkindInputs = document.querySelectorAll('[name=mkind]');
mkindInputs.forEach(r=>{
  r.onchange=()=>{
    curKind = r.value;
    let bf = $('#builder-fields'), cf = $('#code-fields');
    if(bf) bf.style.display = curKind=='code' ? 'none' : 'block';

const codeTpl = $('#code-tpl');
if(codeTpl){
  codeTpl.onchange=()=>{
    let v=codeTpl.value, src=$('#cd_src');if(!src||!v)return;
    if(v=='dungeon'){
      src.value=`let p={x:80,y:80,hp:100},chests=[{x:200,y:100},{x:440,y:260}],skeletons=[{x:300,y:200,hp:2}],sc=0;
L(d=>{
  p.x+=ax(['ArrowRight','d'],['ArrowLeft','a'])*160*d;
  p.y+=ax(['ArrowDown','s'],['ArrowUp','w'])*160*d;
  if(K[' ']||P.click){
    skeletons.forEach(s=>{if(Math.hypot(s.x-p.x,s.y-p.y)<45){s.hp--;boom(s.x,s.y,'#f43f5e');snd(220);if(s.hp<=0)sc+=100;a.score(sc)}});
  }
  skeletons=skeletons.filter(s=>s.hp>0);
  chests=chests.filter(c=>{if(Math.hypot(c.x-p.x,c.y-p.y)<25){sc+=50;a.score(sc);snd(900);boom(c.x,c.y,'#fbbf24');return 0}return 1});
  x.fillStyle='#0f0c1b';x.fillRect(0,0,W,H);
  chests.forEach(c=>{x.font='20px system-ui';x.fillText('📦',c.x-10,c.y+7)});
  skeletons.forEach(s=>{x.font='20px system-ui';x.fillText('💀',s.x-10,s.y+7)});
  x.font='24px system-ui';x.fillText('🗡️',p.x-12,p.y+8);
  dFx(x,d);
  x.fillStyle='#fff';x.font='700 14px system-ui';x.fillText('Dungeon Run · Score: '+sc,12,20);
});`;
    } else if(v=='blaster'){
      src.value=`let p={x:320,y:350},b=[],e=[],sc=0,t=0;
L(d=>{
  p.x=Math.max(20,Math.min(620,p.x+ax(['ArrowRight','d'],['ArrowLeft','a'])*260*d));
  if((t-=d)<=0){t=.6;e.push({x:rnd(30,610),y:-20,sp:rnd(70,140)})}
  if(K[' ']||P.click){b.push({x:p.x,y:p.y-10});snd(800)}
  b.forEach(q=>q.y-=400*d);e.forEach(n=>n.y+=n.sp*d);
  b=b.filter(q=>{
    for(const n of e){if(Math.hypot(n.x-q.x,n.y-q.y)<20){n.dead=1;boom(n.x,n.y,'#38bdf8');sc+=20;a.score(sc);snd(200);return 0}}
    return q.y>-10;
  });
  e=e.filter(n=>!n.dead&&n.y<H+20);
  x.fillStyle='#030712';x.fillRect(0,0,W,H);
  b.forEach(q=>{x.fillStyle='#38bdf8';x.fillRect(q.x-2,q.y,4,10)});
  e.forEach(n=>{x.font='20px system-ui';x.fillText('👾',n.x-10,n.y+7)});
  x.font='24px system-ui';x.fillText('🚀',p.x-12,p.y+8);
  dFx(x,d);
  x.fillStyle='#fff';x.font='700 14px system-ui';x.fillText('Score: '+sc,12,20);
});`;
    } else if(v=='jumper'){
      src.value=`let p={x:100,y:300,vy:0},coins=[],sc=0;
for(let i=0;i<8;i++)coins.push({x:160+i*60,y:rnd(180,300),taken:0});
L(d=>{
  p.x+=ax(['ArrowRight','d'],['ArrowLeft','a'])*180*d;
  p.vy+=1000*d;p.y+=p.vy*d;
  if(p.y>=330){p.y=330;p.vy=0;if(K[' ']||K.ArrowUp||P.down){p.vy=-520;snd(500)}}
  coins.forEach(c=>{if(!c.taken&&Math.hypot(c.x-p.x,c.y-p.y)<24){c.taken=1;sc+=50;a.score(sc);snd(900);boom(c.x,c.y,'#fde047')}});
  x.fillStyle='#1e1b4b';x.fillRect(0,0,W,H);
  x.fillStyle='#312e81';x.fillRect(0,350,W,50);
  coins.forEach(c=>{if(!c.taken){x.font='20px system-ui';x.fillText('🪙',c.x-10,c.y+7)}});
  x.font='24px system-ui';x.fillText('🥷',p.x-12,p.y+8);
  dFx(x,d);
  x.fillStyle='#fff';x.font='700 14px system-ui';x.fillText('Ninja Jump · Coins: '+sc,12,20);
});`;
    }
  };
}

let pvS = null;
const runTestPreview = ()=>{
  if(pvS){pvS.dead=1;pvS=null}
  let cv = $('#pvcv');if(!cv)return;
  let cx = cv.getContext('2d');
  let kind = document.querySelector('[name=mkind]:checked')?.value || 'builder';
  let tempGame = {
    id:'preview',kind,
    t:$('#t')?.value.trim()||'Test Game',
    arch:$('#b_arch')?.value||'dungeon',
    pChar:$('#b_pChar')?.value||'🧙‍♂️',
    pSpd:$('#b_pSpd')?.value||170,
    iChar:$('#b_iChar')?.value||'💎',
    iCount:$('#b_iCount')?.value||8,
    iVal:$('#b_iVal')?.value||50,
    eChar:$('#b_eChar')?.value||'👾',
    eCount:$('#b_eCount')?.value||4,
    eSpd:$('#b_eSpd')?.value||70,
    timeGoal:$('#b_time')?.value||60,
    code:$('#cd_src')?.value||'',
    col:($('#c1')?.value||'#7928ca')+','+($('#c2')?.value||'#110026')
  };
  let runner = makeCustomGameRunner(tempGame);
  pvS = {dead:0,over:0,sc:0};
  const api = {score:n=>pvS.sc=n,snd,over:m=>{pvS.over=1;cx.fillStyle='#000a';cx.fillRect(0,0,W,H);cx.fillStyle='#fff';cx.font='24px system-ui';cx.textAlign='center';cx.fillText(m||'Test Over',W/2,H/2);cx.textAlign='left'}};
  const L = f => {let last=performance.now();(function t(n){if(pvS.dead)return;let d=Math.min(.05,(n-last)/1000||0);last=n;if(!pvS.over)f(d);P.click=0;pvS.raf=requestAnimationFrame(t)})(last)};
  runner(cx,api,L);
};

const btnTest = $('#btn-test'), btnStop = $('#btn-stop');
if(btnTest) btnTest.onclick = runTestPreview;
if(btnStop) btnStop.onclick = ()=>{if(pvS){pvS.dead=1;cancelAnimationFrame(pvS.raf);pvS=null};let cv=$('#pvcv');if(cv)cv.getContext('2d').clearRect(0,0,W,H)};
}

addEventListener('click',ev=>{
  let b=ev.target.closest('[data-a]');if(!b||!AD)return;
  let a=b.dataset.a,i=b.dataset.i,er=m=>$('#er')&&($('#er').textContent=m);
  let sv=()=>{LS('cg',CG);LS('hid',HID);sync();admin();try{fetch('/api/custom-games',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customGames:CG,hiddenGames:HID})}).then(r=>r.json()).then(()=>{window.parent.postMessage({type:'CUSTOM_GAMES_UPDATED',customGames:CG},'*')}).catch(err=>console.warn('Sync games error:',err))}catch(e){}};
  if(a=='lock'){AD=0;admin()}
  else if(a=='ed'){EDIT=i;adminTab='create';admin();scrollTo(0,0)}
  else if(a=='cancel'){EDIT=null;adminTab='manage';admin()}
  else if(a=='pub'){let c=CG.find(c=>c.id==i);if(c){c.pub=c.pub===false?true:false;sv()}}
  else if(a=='del'){if(confirm('Delete this game?')){CG=CG.filter(c=>c.id!=i);sv()}}
  else if(a=='hid'){HID=HID.includes(i)?HID.filter(h=>h!=i):[...HID,i];sv()}
  else if(a=='imp'){
    try{
      let l=JSON.parse($('#io').value);if(!Array.isArray(l))throw 0;
      CG=l.map(c=>({
        id:String(c.id||Date.now().toString(36)).replace(/\\W/g,''),
        kind:c.kind||'builder',arch:c.arch||'dungeon',
        t:String(c.t||'Untitled').slice(0,40),
        e:String(c.e||'🎮').slice(0,4),
        d:String(c.d||'').slice(0,300),
        url:c.url||'',code:c.code||'',
        ctl:String(c.ctl||'').slice(0,120),
        pChar:c.pChar||'🧙‍♂️',pSpd:c.pSpd||170,
        iChar:c.iChar||'💎',iCount:c.iCount||8,iVal:c.iVal||50,
        eChar:c.eChar||'👾',eCount:c.eCount||4,eSpd:c.eSpd||70,
        timeGoal:c.timeGoal||60,
        cats:Array.isArray(c.cats)?c.cats:['Adventure'],
        col:c.col||'#7928ca,#110026',feat:!!c.feat,pub:c.pub!==false
      }));
      sv();
    }catch(x){er('Invalid backup JSON format.')}
  }
  else if(a=='save-create'){
    let t=$('#t').value.trim(),d=$('#d').value.trim();
    if(t.length<2)return er('Enter a game title.');
    if(d.length<5)return er('Enter a short description.');
    let kind = document.querySelector('[name=mkind]:checked')?.value || 'builder';
    let code = $('#cd_src')?.value.trim() || '';
    if(kind=='code'&&code.length<10)return er('Please enter valid JavaScript game code.');
    let cats = [...document.querySelectorAll('[name=cat]:checked')].map(z=>z.value);
    if(!cats.length)cats=['Adventure'];
    let o = {
      id: EDIT || Date.now().toString(36),
      kind,
      arch: $('#b_arch')?.value || 'dungeon',
      t,
      e: $('#em').value.trim() || '🎮',
      d,
      ctl: $('#ct').value.trim() || 'WASD / Arrows to move · Space for action',
      pChar: $('#b_pChar')?.value.trim() || '🧙‍♂️',
      pSpd: Number($('#b_pSpd')?.value) || 170,
      iChar: $('#b_iChar')?.value.trim() || '💎',
      iCount: Number($('#b_iCount')?.value) || 8,
      iVal: Number($('#b_iVal')?.value) || 50,
      eChar: $('#b_eChar')?.value.trim() || '👾',
      eCount: Number($('#b_eCount')?.value) || 4,
      eSpd: Number($('#b_eSpd')?.value) || 70,
      timeGoal: Number($('#b_time')?.value) || 60,
      code,
      cats,
      col: ($('#c1').value) + ',' + ($('#c2').value),
      feat: $('#ft').checked,
